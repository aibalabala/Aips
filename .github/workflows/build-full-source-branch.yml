name: Build Full Source Branch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-full-source-branch.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble full source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.7 https://github.com/robbietilton/Compositor.git "$RUNNER_TEMP/full"
          rm -rf "$RUNNER_TEMP/full/.git"
          rsync -a aips-overlay/ "$RUNNER_TEMP/full/"

      - name: Prepare full-source branch
        shell: bash
        run: |
          set -euo pipefail

          git switch -C full-source

          # Keep .github byte-for-byte identical to main so GITHUB_TOKEN
          # does not need workflow-write permission.
          rm -rf Compositor CompositorTests CompositorUITests Compositor.xcodeproj Config docs scripts
          rm -f AGENTS.md LICENSE appcast.xml .gitignore README.md
          rm -rf aips-overlay

          rsync -a --exclude '.github/' "$RUNNER_TEMP/full/" ./

          test -f Compositor.xcodeproj/project.pbxproj
          test -d Compositor
          test -d CompositorTests
          test ! -e aips-overlay

      - name: Commit source-only migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate Aips source to repository root"
          git push --force-with-lease origin HEAD:full-source
