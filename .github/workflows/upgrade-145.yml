name: Upgrade Candidate v1.4.5

on:
  push:
    branches:
      - 'upgrade/v1.4.5-aips.1'
    paths:
      - '.github/workflows/upgrade-145.yml'

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/robbietilton/Compositor.git
          git fetch --no-tags upstream             refs/tags/v1.3.7:refs/tags/upstream-v1.3.7             refs/tags/v1.4.5:refs/tags/upstream-v1.4.5

      - name: Apply upstream delta with three-way merge
        id: merge
        shell: bash
        run: |
          set +e
          git diff --binary upstream-v1.3.7 upstream-v1.4.5 > "$RUNNER_TEMP/upstream-145.patch"
          git apply --3way --index "$RUNNER_TEMP/upstream-145.patch"
          status=$?

          if [ "$status" -ne 0 ]; then
            python3 <<'PY'
          from pathlib import Path

          replacements = {
              "Compositor.xcodeproj/project.pbxproj": [
                  """\t\t\t\tMARKETING_VERSION = 1.4.5;
          \t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = com.aibalabala.aips;
          \t\t\t\tPRODUCT_NAME = Aips;
          \t\t\t\tPRODUCT_MODULE_NAME = Compositor;""",
                  """\t\t\t\tMARKETING_VERSION = 1.4.5;
          \t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = com.aibalabala.aips;
          \t\t\t\tPRODUCT_NAME = Aips;
          \t\t\t\tPRODUCT_MODULE_NAME = Compositor;""",
              ],
              "Compositor/Document/SmudgeLiquify.swift": [
                  """            brushError = isMaskSelected ? localized("Smudge and Liquify work on a layer's pixels, not its mask.") : paintRefusal""",
              ],
              "Compositor/UI/CameraRawColorControls.swift": [
                  """                .help(localized("RGB changes brightness. Red, green, and blue also shift the color."))
                          .onChange(of: edit?.cameraRawPointChannel) { _, _ in selected = nil; drag = nil }
                      }
                      curveGraph
                          .frame(height: 150)
                          .help(localized(edit?.cameraRawCurvePage == .parametric
                                ? "Drag up or down to lift or lower those tones. Drag a divider along the bottom to change which tones each region covers."
                                : "Drag a point. Click to add one. Double-click a point to remove it."))""",
              ],
              "Compositor/UI/LayerMaskMenu.swift": [
                  """            .help(localized(session.selection == nil ? "Add layer mask (Option-click for a black mask)"
                            : "Add layer mask revealing the selection (Option-click to hide it)"))
                      .accessibilityLabel(localized("Add layer mask"))""",
              ],
              "Compositor/UI/NativeLayerList.swift": [
                  """        linkButton.toolTip = localized(layer.mask?.isLinked == false ? "Link layer and mask so they move together"
                      : "Unlink layer and mask to move or transform them separately")
                  linkButton.setAccessibilityLabel(String(localized: layer.mask?.isLinked == false ? "Link mask: \\(layer.name)" : "Unlink mask: \\(layer.name)"))
                  thumbnail.toolTip = localized(editableText ? "Editable text layer" : "Select image pixels")
                  maskThumbnail.toolTip = localized("Select layer mask; Option-click to view it alone; Shift-click to enable/disable; Cmd-click to select its black areas (Cmd-Shift adds, Cmd-Option subtracts)")
                  thumbnail.setAccessibilityLabel(String(localized: "Select \\(editableText ? localized("text") : localized("image")): \\(layer.name)"))
                  maskThumbnail.setAccessibilityLabel(String(localized: "Select mask: \\(layer.name)"))""",
                  """        dimensions.stringValue = layer.liveText != nil ? localized("Text · Double-click to edit") : layer.adjustment != nil ? localized("Adjustment · Double-click to edit") : layer.isGroup ? localized("Folder") : layer.sizeLabel""",
              ],
              "Compositor/UI/ProjectTabs.swift": [
                  """        .frame(width: contentWidth, height: 34, alignment: .topLeading)
                  .accessibilityLabel(localized("Project tabs"))""",
                  """            .fixedSize()
                      .help(localized("Drop to open in a new canvas"))
                      .accessibilityLabel(localized("Drop into new canvas"))""",
              ],
              "Compositor/UI/TransformInspector.swift": [
                  """          // Command flips Auto Select while it's held, and the box shows it flipped (see HeldModifiers).
                    Toggle("Auto Select", isOn: Binding(get: { session.transformAutoSelect != held.contains(.command) },
                                                        set: { session.transformAutoSelect = $0 != held.contains(.command) }))
                        .help(localized("Select layers by clicking the canvas. Hold Command to turn it the other way while you click."))""",
                  """                TransformValueField(label: "W", value: value.size.width, range: 1...30_000, finish: finish) { resize($0, width: true) }.frame(width: 85)
                          TransformValueField(label: "H", value: value.size.height, range: 1...30_000, finish: finish) { resize($0, width: false) }.frame(width: 85)
                          // Shift flips the lock while dragging a handle, and the button shows it flipped.
                          Toggle(isOn: Binding(get: { session.locksTransformRatio != held.contains(.shift) },
                                               set: { session.locksTransformRatio = $0 != held.contains(.shift) })) { Image(systemName: "link") }
                              .toggleStyle(.button).help(localized("Lock aspect ratio. Hold Shift while dragging a handle to turn it the other way."))
                          TransformValueField(label: "Scale", suffix: "%", value: value.scalePercent(pixelSize: pixelSize), range: 0.1...30_000, finish: finish) { number in""",
                  """                }), range: range, step: 1, onEnd: finish)
                      TextField(localized(label), text: $text)""",
              ],
              "appcast.xml": [
                  """      <title>Version 1.3.7</title>
                      <pubDate>Sun, 27 Sep 2026 23:14:02 +0000</pubDate>
                      <sparkle:version>34</sparkle:version>
                      <sparkle:shortVersionString>1.3.7</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                      <link>https://github.com/robbietilton/Compositor/releases/tag/v1.3.7</link>
                      <enclosure url="https://github.com/robbietilton/Compositor/releases/download/v1.3.7/Compositor.dmg" sparkle:edSignature="OQ5U18KWacK4oaZXgUDhdhxkijx7zBy4zkOUSfyFod9tc8OSaGoMpXq2BWPxaURxOQsAY75udMvnn4aI2CtdBQ==" length="6595198" type="application/octet-stream"/>""",
              ],
          }

          def resolve(path: str, choices: list[str]) -> None:
              p = Path(path)
              lines = p.read_text(encoding="utf-8").splitlines()
              out = []
              choice_i = 0
              i = 0
              while i < len(lines):
                  if lines[i].startswith("<<<<<<<"):
                      if choice_i >= len(choices):
                          raise RuntimeError(f"Missing resolution for {path} block {choice_i + 1}")
                      i += 1
                      while i < len(lines) and not lines[i].startswith("======="):
                          i += 1
                      if i >= len(lines):
                          raise RuntimeError(f"Malformed conflict in {path}")
                      i += 1
                      while i < len(lines) and not lines[i].startswith(">>>>>>>"):
                          i += 1
                      if i >= len(lines):
                          raise RuntimeError(f"Malformed conflict in {path}")
                      out.extend(choices[choice_i].splitlines())
                      choice_i += 1
                      i += 1
                      continue
                  out.append(lines[i])
                  i += 1
              if choice_i != len(choices):
                  raise RuntimeError(f"Expected {len(choices)} conflicts in {path}, resolved {choice_i}")
              p.write_text("\n".join(out) + "\n", encoding="utf-8")

          for path, choices in replacements.items():
              resolve(path, choices)

          # Preserve the new 1.4 scaled-layer percentage while localizing its pixel-size prefix.
          p = Path("Compositor/UI/NativeLayerList.swift")
          text = p.read_text(encoding="utf-8")
          old = '        let text = "\\(Int(size.width.rounded())) × \\(Int(size.height.rounded())) px"'
          new = '        let text = String(localized: "\\(Int(size.width.rounded())) × \\(Int(size.height.rounded())) px")'
          if old not in text:
              raise RuntimeError("NativeLayerList sizeLabel anchor not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

            git add               Compositor.xcodeproj/project.pbxproj               Compositor/Document/SmudgeLiquify.swift               Compositor/UI/CameraRawColorControls.swift               Compositor/UI/LayerMaskMenu.swift               Compositor/UI/NativeLayerList.swift               Compositor/UI/ProjectTabs.swift               Compositor/UI/TransformInspector.swift               appcast.xml

            if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
              status=0
            fi
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"

          mkdir -p "$RUNNER_TEMP/merge-report"
          git diff --name-only --diff-filter=U | sort -u > "$RUNNER_TEMP/merge-report/conflicts.txt"
          git diff --name-only --cached | sort -u > "$RUNNER_TEMP/merge-report/staged.txt"

          mkdir -p "$RUNNER_TEMP/merge-report/conflict-files"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            mkdir -p "$RUNNER_TEMP/merge-report/conflict-files/$(dirname "$path")"
            cp "$path" "$RUNNER_TEMP/merge-report/conflict-files/$path"
          done < "$RUNNER_TEMP/merge-report/conflicts.txt"

          echo "## Upgrade merge result" > "$RUNNER_TEMP/merge-report/report.md"
          echo >> "$RUNNER_TEMP/merge-report/report.md"
          echo "- Base: `v1.3.7`" >> "$RUNNER_TEMP/merge-report/report.md"
          echo "- Target: `v1.4.5`" >> "$RUNNER_TEMP/merge-report/report.md"
          echo "- git apply status: `$status`" >> "$RUNNER_TEMP/merge-report/report.md"
          echo "- Conflict files: `$(wc -l < "$RUNNER_TEMP/merge-report/conflicts.txt" | tr -d ' ')`" >> "$RUNNER_TEMP/merge-report/report.md"
          echo >> "$RUNNER_TEMP/merge-report/report.md"
          echo "### Conflicts" >> "$RUNNER_TEMP/merge-report/report.md"
          if [ -s "$RUNNER_TEMP/merge-report/conflicts.txt" ]; then
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/merge-report/conflicts.txt" >> "$RUNNER_TEMP/merge-report/report.md"
          else
            echo "None." >> "$RUNNER_TEMP/merge-report/report.md"
          fi

          cat "$RUNNER_TEMP/merge-report/report.md"
          exit 0

      - name: Upload merge report
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-v1.4.5-merge-report
          path: ${{ runner.temp }}/merge-report/
          retention-days: 30

      - name: Stop on unresolved conflicts
        if: steps.merge.outputs.status != '0'
        shell: bash
        run: |
          echo "::error::Three-way merge has unresolved conflicts. Review merge-report artifact."
          exit 1

      - name: Record candidate versions
        shell: bash
        run: |
          printf 'v1.4.5\n' > UPSTREAM_VERSION
          printf '1.4.5-aips.1\n' > AIPS_VERSION
          git add UPSTREAM_VERSION AIPS_VERSION

      - name: Commit merged upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Merge Compositor v1.4.5 into Aips"
          git push origin HEAD:upgrade/v1.4.5-aips.1
