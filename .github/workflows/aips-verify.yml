name: Aips Verify

on:
  push:
    branches: [ main ]
    paths:
      - 'Compositor/**'
      - 'CompositorTests/**'
      - 'CompositorUITests/**'
      - 'Compositor.xcodeproj/**'
      - 'Config/**'
      - '.github/workflows/aips-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout Aips source
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version


      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build for testing
        id: build
        run: >
          xcodebuild build-for-testing
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -configuration Debug
          -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=-

      - name: Run unit tests in parallel
        run: >
          xcodebuild test-without-building
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          -resultBundlePath ParallelResults.xcresult
          -parallel-testing-enabled YES
          -skip-testing:CompositorTests/FloatingPanelTests
          -skip-testing:CompositorTests/SliderSnapTests

      - name: Run window tests serially
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          xcodebuild test-without-building
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          -resultBundlePath SerialResults.xcresult
          -parallel-testing-enabled NO
          -only-testing:CompositorTests/FloatingPanelTests
          -only-testing:CompositorTests/SliderSnapTests

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Aips-test-results
          path: '*.xcresult'
          retention-days: 7
          if-no-files-found: ignore
