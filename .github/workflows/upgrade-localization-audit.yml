name: Upgrade v1.4.5 Localization Audit

on:
  push:
    branches:
      - 'upgrade/v1.4.5-aips.1'
    paths:
      - '.github/workflows/upgrade-localization-audit.yml'
      - 'scripts/localization_audit.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream comparison tags
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/robbietilton/Compositor.git
          git fetch --no-tags upstream             refs/tags/v1.3.7:refs/tags/upstream-v1.3.7             refs/tags/v1.4.5:refs/tags/upstream-v1.4.5

      - name: Audit new upstream UI strings
        run: |
          python3 scripts/localization_audit.py             --catalog Compositor/Localizable.xcstrings             --base-ref upstream-v1.3.7             --latest-ref upstream-v1.4.5             --output upgrade-localization-audit.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-v1.4.5-localization-audit
          path: upgrade-localization-audit.md
          retention-days: 30
