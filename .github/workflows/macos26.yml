name: macOS 26 Runner Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos26:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: System info
        run: |
          echo "=== sw_vers ==="
          sw_vers
          echo "=== uname ==="
          uname -a
          echo "=== arch ==="
          uname -m
          echo "=== xcode ==="
          xcodebuild -version
          echo "=== swift ==="
          swift --version
      - name: Swift smoke test
        run: |
          cat > /tmp/hello.swift <<'SWIFT'
          import Foundation
          print("Hello from macOS 26 runner")
          print(ProcessInfo.processInfo.operatingSystemVersionString)
          SWIFT
          swift /tmp/hello.swift
