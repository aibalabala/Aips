name: Aips Signed & Notarized Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Checkout Aips source
        uses: actions/checkout@v4

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in             APPLE_CERTIFICATE_P12_BASE64             APPLE_CERTIFICATE_PASSWORD             APPLE_ID             APPLE_TEAM_ID             APPLE_APP_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Formal release requires a Developer ID Application certificate and Apple notarization credentials."
            exit 1
          fi

      - name: Show runner
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version


      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build unsigned Release app
        run: >
          xcodebuild
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/aips-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH"             -k "$KEYCHAIN"             -P "$APPLE_CERTIFICATE_PASSWORD"             -T /usr/bin/codesign             -T /usr/bin/security
          security set-key-partition-list             -S apple-tool:,apple:,codesign:             -s             -k "$KEYCHAIN_PASSWORD"             "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" |
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' |
            head -n 1)"

          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in the imported certificate."
            exit 1
          fi

          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "Developer ID identity found."

      - name: Sign Aips.app
        shell: bash
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/Aips.app"
          test -d "$APP"

          # Sign nested code from deepest path to shallowest path.
          while IFS= read -r -d '' item; do
            /usr/bin/codesign               --force               --timestamp               --options runtime               --sign "$SIGNING_IDENTITY"               --keychain "$SIGNING_KEYCHAIN"               "$item"
          done < <(
            find "$APP/Contents" -depth               \( -name '*.app' -o -name '*.xpc' -o -name '*.framework' -o -name '*.dylib' \)               -print0
          )

          /usr/bin/codesign             --force             --timestamp             --options runtime             --sign "$SIGNING_IDENTITY"             --keychain "$SIGNING_KEYCHAIN"             "$APP"

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/bin/spctl -a -vvv -t exec "$APP" || true

      - name: Prepare notarization archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent             DerivedData/Build/Products/Release/Aips.app             Aips-notarization.zip

      - name: Submit to Apple notarization
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool submit Aips-notarization.zip             --apple-id "$APPLE_ID"             --team-id "$APPLE_TEAM_ID"             --password "$APPLE_APP_PASSWORD"             --wait

      - name: Staple and validate notarization
        run: |
          APP="DerivedData/Build/Products/Release/Aips.app"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/sbin/spctl -a -vvv -t exec "$APP"

      - name: Package notarized app
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          ditto -c -k --sequesterRsrc --keepParent             DerivedData/Build/Products/Release/Aips.app             "Aips-${VERSION}-macOS-arm64.zip"

      - name: Upload notarized artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aips-notarized-macOS-arm64
          path: Aips-*-macOS-arm64.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             Aips-*-macOS-arm64.zip             --title "Aips $GITHUB_REF_NAME"             --generate-notes

      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
