name: Backfill DMG Release Asset

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/backfill-dmg.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      TAG: v1.3.7-aips.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download existing Universal 2 release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG"             --pattern 'Aips-1.3.7-aips.1-macOS-universal2-adhoc.zip'             --dir "$RUNNER_TEMP/release"

      - name: Extract Aips.app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app"
          ditto -x -k             "$RUNNER_TEMP/release/Aips-1.3.7-aips.1-macOS-universal2-adhoc.zip"             "$RUNNER_TEMP/app"
          test -d "$RUNNER_TEMP/app/Aips.app"
          lipo -info "$RUNNER_TEMP/app/Aips.app/Contents/MacOS/Aips"

      - name: Build installable DMG
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg-stage"
          DMG="Aips-1.3.7-aips.1-macOS-universal2-adhoc.dmg"

          mkdir -p "$STAGE"
          ditto "$RUNNER_TEMP/app/Aips.app" "$STAGE/Aips.app"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create             -volname "Aips 1.3.7-aips.1"             -srcfolder "$STAGE"             -ov             -format UDZO             "$DMG"

          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Upload DMG directly to prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG"             Aips-1.3.7-aips.1-macOS-universal2-adhoc.dmg             Aips-1.3.7-aips.1-macOS-universal2-adhoc.dmg.sha256             --clobber
