name: Aips Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'Compositor/**'
      - 'Compositor.xcodeproj/**'
      - 'Config/**'
      - 'Package.resolved'
      - '.github/workflows/release-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout Aips source
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build Aips.app
        run: >
          xcodebuild
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=-
          build

      - name: Re-sign bundled code ad-hoc
        shell: bash
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/Aips.app"

          while IFS= read -r -d '' item; do
            /usr/bin/codesign --force --sign - "$item"
          done < <(
            find "$APP/Contents" -depth               \( -name '*.framework' -o -name '*.dylib' -o -name '*.xpc' -o -name '*.app' \)               -print0
          )

          /usr/bin/codesign --force --deep --sign - "$APP"

      - name: Verify app
        run: |
          APP_PATH="DerivedData/Build/Products/Release/Aips.app"
          test -d "$APP_PATH"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          /usr/bin/file "$APP_PATH/Contents/MacOS/Aips"

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent             DerivedData/Build/Products/Release/Aips.app             Aips-macOS26-arm64.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aips-macOS26-arm64
          path: Aips-macOS26-arm64.zip
          retention-days: 14
