name: Aips Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout Aips overlay
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Fetch upstream Compositor 1.3.7
        run: |
          git clone --depth 1 --branch v1.3.7 https://github.com/robbietilton/Compositor.git AipsSource
          rm -rf AipsSource/.git

      - name: Apply Aips overlay
        run: |
          rsync -a aips-overlay/ AipsSource/

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        working-directory: AipsSource
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build Aips.app
        working-directory: AipsSource
        run: >
          xcodebuild
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=-
          build

      - name: Locate app
        id: app
        working-directory: AipsSource
        run: |
          APP_PATH="DerivedData/Build/Products/Release/Aips.app"
          test -d "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          /usr/bin/codesign -dv --verbose=4 "$APP_PATH" 2>&1 || true
          /usr/bin/file "$APP_PATH/Contents/MacOS/Aips"

      - name: Package app
        working-directory: AipsSource
        run: |
          ditto -c -k --sequesterRsrc --keepParent             DerivedData/Build/Products/Release/Aips.app             ../Aips-macOS26-arm64.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aips-macOS26-arm64
          path: Aips-macOS26-arm64.zip
          retention-days: 14
