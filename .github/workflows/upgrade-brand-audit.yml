name: Upgrade Brand Audit

on:
  push:
    branches:
      - 'upgrade/v1.4.5-aips.1'
    paths:
      - '.github/workflows/upgrade-brand-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Compositor branding in app-facing source
        shell: bash
        run: |
          set +e
          grep -RIn --include='*.swift' --include='*.plist' --include='*.xcstrings'             -E '"[^"]*Compositor[^"]*"|>Compositor[^<]*<'             Compositor Config | tee brand-audit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-brand-audit
          path: brand-audit.txt
          retention-days: 14
