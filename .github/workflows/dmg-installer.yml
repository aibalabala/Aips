name: Aips DMG Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Compositor/**'
      - 'Compositor.xcodeproj/**'
      - 'Config/**'
      - 'AIPS_VERSION'
      - '.github/workflows/dmg-installer.yml'

permissions:
  contents: read

jobs:
  build-dmg:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout Aips source
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          set -euo pipefail
          AIPS_VERSION="$(tr -d '[:space:]' < AIPS_VERSION)"
          APP_VERSION="${AIPS_VERSION%%-aips.*}"
          echo "AIPS_VERSION=$AIPS_VERSION" >> "$GITHUB_ENV"
          echo "AIPS_APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "AIPS_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build Universal 2 Aips.app
        run: >
          xcodebuild
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath DerivedData
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          MARKETING_VERSION="$AIPS_APP_VERSION"
          CURRENT_PROJECT_VERSION="$AIPS_BUILD_NUMBER"
          CODE_SIGN_IDENTITY=-
          build

      - name: Verify app
        shell: bash
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/Aips.app"
          BIN="$APP/Contents/MacOS/Aips"

          test -d "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64

      - name: Build DMG installer
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$RUNNER_TEMP/Aips-DMG"
          APP="DerivedData/Build/Products/Release/Aips.app"
          DMG="Aips-${AIPS_VERSION}-macOS-universal2-adhoc.dmg"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          ditto "$APP" "$STAGE/Aips.app"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create             -volname "Aips ${AIPS_VERSION}"             -srcfolder "$STAGE"             -ov             -format UDZO             "$DMG"

          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

          echo "DMG:"
          ls -lh "$DMG"
          cat "$DMG.sha256"

      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: Aips-${{ env.AIPS_VERSION }}-DMG-installer
          path: |
            Aips-${{ env.AIPS_VERSION }}-macOS-universal2-adhoc.dmg
            Aips-${{ env.AIPS_VERSION }}-macOS-universal2-adhoc.dmg.sha256
          retention-days: 30
