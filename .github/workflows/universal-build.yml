name: Aips Universal 2 Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'aips-overlay/**'
      - '.github/workflows/universal-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout Aips overlay
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Fetch upstream Compositor 1.3.7
        run: |
          git clone --depth 1 --branch v1.3.7 https://github.com/robbietilton/Compositor.git AipsSource
          rm -rf AipsSource/.git

      - name: Apply Aips overlay
        run: rsync -a aips-overlay/ AipsSource/

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        working-directory: AipsSource
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build Universal 2 Aips.app
        working-directory: AipsSource
        run: >
          xcodebuild
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath DerivedData
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGN_IDENTITY=-
          build

      - name: Verify Universal 2 executable
        working-directory: AipsSource
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/Aips.app"
          BIN="$APP/Contents/MacOS/Aips"
          test -d "$APP"
          test -f "$BIN"
          file "$BIN"
          lipo -info "$BIN"

          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"

          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Audit nested Mach-O architectures
        working-directory: AipsSource
        shell: bash
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/Aips.app"
          failed=0

          while IFS= read -r -d '' f; do
            info="$(file "$f")"
            if [[ "$info" == *"Mach-O"* ]]; then
              archs="$(lipo -archs "$f" 2>/dev/null || true)"
              echo "$f :: $archs"

              if [[ "$archs" != *"arm64"* || "$archs" != *"x86_64"* ]]; then
                echo "::error::Non-universal Mach-O: $f ($archs)"
                failed=1
              fi
            fi
          done < <(find "$APP" -type f -print0)

          exit "$failed"

      - name: Package Universal 2 app
        working-directory: AipsSource
        run: |
          ditto -c -k --sequesterRsrc --keepParent             DerivedData/Build/Products/Release/Aips.app             ../Aips-macOS26-universal2.zip

      - name: Upload Universal 2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aips-macOS26-universal2
          path: Aips-macOS26-universal2.zip
          retention-days: 14
