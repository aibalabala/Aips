name: Aips Universal 2 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - full-source
      - 'release/v*'
    tags:
      - 'v*'
    paths:
      - 'Compositor/**'
      - 'Compositor.xcodeproj/**'
      - 'Config/**'
      - 'Package.resolved'
      - '.github/workflows/universal-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout Aips source
        uses: actions/checkout@v4

      - name: Derive version
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME#release/}"
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi

          echo "AIPS_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unsupported version derived from ref: $VERSION"
            exit 1
          fi

          APP_VERSION="${VERSION%%-aips.*}"
          if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid Apple app version derived from $VERSION: $APP_VERSION"
            exit 1
          fi

          echo "AIPS_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "AIPS_APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "AIPS_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Version: $VERSION"
          echo "Build: $GITHUB_RUN_NUMBER"

      - name: Show runner
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version


      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build Universal 2 Aips.app
        run: >
          xcodebuild
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath DerivedData
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          MARKETING_VERSION="$AIPS_APP_VERSION"
          CURRENT_PROJECT_VERSION="$AIPS_BUILD_NUMBER"
          CODE_SIGN_IDENTITY=-
          build

      - name: Re-sign bundled code ad-hoc
        shell: bash
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/Aips.app"

          # Re-sign nested code deepest-first so every bundled framework/plugin
          # uses the same ad-hoc identity as the host app.
          while IFS= read -r -d '' item; do
            /usr/bin/codesign --force --sign - "$item"
          done < <(
            find "$APP/Contents" -depth               \( -name '*.framework' -o -name '*.dylib' -o -name '*.xpc' -o -name '*.app' \)               -print0
          )

          /usr/bin/codesign --force --deep --sign - "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Verify version and Universal 2 executable
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/Aips.app"
          BIN="$APP/Contents/MacOS/Aips"
          PLIST="$APP/Contents/Info.plist"

          test -d "$APP"
          test -f "$BIN"
          test -f "$PLIST"

          SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"

          echo "CFBundleShortVersionString=$SHORT_VERSION"
          echo "CFBundleVersion=$BUILD_VERSION"

          test "$SHORT_VERSION" = "$AIPS_APP_VERSION"
          test "$BUILD_VERSION" = "$AIPS_BUILD_NUMBER"

          file "$BIN"
          lipo -info "$BIN"

          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Audit nested Mach-O architectures
        shell: bash
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/Aips.app"
          failed=0

          while IFS= read -r -d '' f; do
            info="$(file "$f")"
            if [[ "$info" == *"Mach-O"* ]]; then
              archs="$(lipo -archs "$f" 2>/dev/null || true)"
              echo "$f :: $archs"
              if [[ "$archs" != *"arm64"* || "$archs" != *"x86_64"* ]]; then
                echo "::error::Non-universal Mach-O: $f ($archs)"
                failed=1
              fi
            fi
          done < <(find "$APP" -type f -print0)

          exit "$failed"

      - name: Package Universal 2 app
        run: |
          OUT="Aips-${AIPS_VERSION}-macOS-universal2-adhoc.zip"
          ditto -c -k --sequesterRsrc --keepParent             DerivedData/Build/Products/Release/Aips.app             "$OUT"
          shasum -a 256 "Aips-${AIPS_VERSION}-macOS-universal2-adhoc.zip"             > "Aips-${AIPS_VERSION}-macOS-universal2-adhoc.zip.sha256"
          cat "Aips-${AIPS_VERSION}-macOS-universal2-adhoc.zip.sha256"

      - name: Build DMG installer
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg-stage"
          DMG="Aips-${AIPS_VERSION}-macOS-universal2-adhoc.dmg"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto DerivedData/Build/Products/Release/Aips.app "$STAGE/Aips.app"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create             -volname "Aips ${AIPS_VERSION}"             -srcfolder "$STAGE"             -ov             -format UDZO             "$DMG"

          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Upload Universal 2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aips-${{ env.AIPS_VERSION }}-macOS-universal2-adhoc
          path: |
            Aips-${{ env.AIPS_VERSION }}-macOS-universal2-adhoc.zip
            Aips-${{ env.AIPS_VERSION }}-macOS-universal2-adhoc.zip.sha256
            Aips-${{ env.AIPS_VERSION }}-macOS-universal2-adhoc.dmg
            Aips-${{ env.AIPS_VERSION }}-macOS-universal2-adhoc.dmg.sha256
          retention-days: 14

      - name: Publish GitHub prerelease
        if: env.AIPS_RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Aips-${AIPS_VERSION}-macOS-universal2-adhoc.zip"
          SHA="${ZIP}.sha256"
          DMG="Aips-${AIPS_VERSION}-macOS-universal2-adhoc.dmg"
          DMGSHA="${DMG}.sha256"

          cat > release-notes.md <<EOF
          ## Aips ${AIPS_VERSION}

          Universal 2 build for macOS, containing both **arm64** and **x86_64** architectures.

          **Important:** this automated build uses ad-hoc signing and is **not Apple-notarized**. It is intended for testing and community distribution until the Developer ID / notarization workflow is configured.

          Files:
          - ${ZIP}
          - ${SHA}
          - ${DMG}
          - ${DMGSHA}
          EOF

          if gh release view "$AIPS_RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $AIPS_RELEASE_TAG already exists."
            exit 1
          fi

          gh release create "$AIPS_RELEASE_TAG"             "$ZIP"             "$SHA"             "$DMG"             "$DMGSHA"             --target "$GITHUB_SHA"             --title "Aips $AIPS_RELEASE_TAG"             --notes-file release-notes.md             --prerelease
# Release trigger: v1.3.7-aips.2
