name: Upgrade v1.4.5 Release Validation

on:
  push:
    branches:
      - 'upgrade/v1.4.5-aips.1'
    paths:
      - '.github/workflows/upgrade-release-validate.yml'

permissions:
  contents: read

jobs:
  arm64:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Resolve packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile
      - name: Build ARM64 Release
        run: >
          xcodebuild
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          MARKETING_VERSION=1.4.5
          CODE_SIGN_IDENTITY=-
          build
      - name: Re-sign and verify
        shell: bash
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/Aips.app"
          while IFS= read -r -d '' item; do
            codesign --force --sign - "$item"
          done < <(find "$APP/Contents" -depth \( -name '*.framework' -o -name '*.dylib' -o -name '*.xpc' -o -name '*.app' \) -print0)
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          file "$APP/Contents/MacOS/Aips"

  universal:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Resolve packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile
      - name: Build Universal 2 Release
        run: >
          xcodebuild
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath DerivedData
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          MARKETING_VERSION=1.4.5
          CODE_SIGN_IDENTITY=-
          build
      - name: Re-sign and verify
        shell: bash
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/Aips.app"
          while IFS= read -r -d '' item; do
            codesign --force --sign - "$item"
          done < <(find "$APP/Contents" -depth \( -name '*.framework' -o -name '*.dylib' -o -name '*.xpc' -o -name '*.app' \) -print0)
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Aips")"
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
          failed=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O'; then
              archs="$(lipo -archs "$f" 2>/dev/null || true)"
              if [[ "$archs" != *arm64* || "$archs" != *x86_64* ]]; then
                echo "::error::Non-universal Mach-O: $f ($archs)"
                failed=1
              fi
            fi
          done < <(find "$APP" -type f -print0)
          exit "$failed"
      - name: Build DMG
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg"
          APP="DerivedData/Build/Products/Release/Aips.app"
          DMG="Aips-1.4.5-aips.1-macOS-universal2-adhoc.dmg"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/Aips.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Aips 1.4.5-aips.1" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Aips-1.4.5-aips.1-release-candidate
          path: |
            Aips-1.4.5-aips.1-macOS-universal2-adhoc.dmg
            Aips-1.4.5-aips.1-macOS-universal2-adhoc.dmg.sha256
          retention-days: 14
